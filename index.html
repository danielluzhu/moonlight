<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moonlight — Tonight's Moon</title>
  <meta name="theme-color" content="#05070f" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <canvas id="mapCanvas" width="1440" height="720"
    aria-label="World map showing where the moon is visible right now"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div id="moonAura" class="hidden" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main class="hud">
    <header class="hud-top">
      <h1>Moonlight</h1>
      <p class="tagline">For those looking at the moon</p>
    </header>

    <!-- Location gate: shown until we have coordinates -->
    <section id="locationGate" class="card gate">
      <p id="gateMessage">To show tonight's moon, Moonlight needs your location.</p>
      <button id="useLocationBtn" class="btn">Use my location</button>
      <div class="divider">or</div>
      <form id="zipForm" class="zip-form">
        <input id="zipInput" inputmode="numeric" autocomplete="postal-code"
               pattern="\d{5}" maxlength="5" placeholder="ZIP code" required
               aria-label="ZIP code" />
        <button type="submit" class="btn btn-secondary">Go</button>
      </form>
      <p id="zipError" class="zip-error hidden"></p>
      <details class="manual">
        <summary>Enter coordinates manually</summary>
        <form id="manualForm">
          <label>Latitude <input id="latInput" type="number" step="any" min="-90" max="90" placeholder="37.77" required /></label>
          <label>Longitude <input id="lonInput" type="number" step="any" min="-180" max="180" placeholder="-122.42" required /></label>
          <button type="submit" class="btn">Show my moon</button>
        </form>
      </details>
    </section>

    <!-- HUD content: hidden until location is known -->
    <section id="moonContent" class="hidden">
      <div id="detailsPanel" class="card details hidden">
        <div class="grid">
          <div class="stat">
            <span class="label">Illumination</span>
            <span class="value" id="illumination">—</span>
            <span class="sub" id="moonAge">—</span>
          </div>
          <div class="stat">
            <span class="label">Moonrise</span>
            <span class="value" id="moonrise">—</span>
            <span class="sub" id="moonriseDir">—</span>
          </div>
          <div class="stat">
            <span class="label">Moonset</span>
            <span class="value" id="moonset">—</span>
            <span class="sub" id="moonsetDir">—</span>
          </div>
          <div class="stat">
            <span class="label">Position now</span>
            <span class="value" id="position">—</span>
            <span class="sub" id="positionDetail">—</span>
          </div>
          <div class="stat">
            <span class="label">Distance</span>
            <span class="value" id="distance">—</span>
            <span class="sub" id="angularSize">—</span>
          </div>
          <div class="stat">
            <span class="label">Next phases</span>
            <span class="value" id="nextFull">—</span>
            <span class="sub" id="nextNew">—</span>
          </div>
        </div>
        <p class="footnote" id="updatedAt"></p>
      </div>

      <div class="hud-bottom">
        <div class="chip phase-chip">
          <canvas id="moonCanvas" width="200" height="200"></canvas>
          <div class="phase-text">
            <span class="phase-eyebrow">Tonight</span>
            <h2 id="phaseName">—</h2>
            <p id="phaseDetail">—</p>
          </div>
        </div>
        <button id="detailsToggle" class="details-toggle" type="button"
          aria-expanded="false" aria-controls="detailsPanel">Moon details ▾</button>
        <p class="chip location-chip">
          <span id="placeName">—</span>
          <button id="changeLocation" class="link-btn" type="button">change</button>
        </p>
      </div>
    </section>
  </main>

  <script src="astro.js"></script>
  <script src="app.js"></script>
</body>
</html>
